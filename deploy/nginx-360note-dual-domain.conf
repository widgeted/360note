# 360note dual-domain production template
#
# 360biji.com = Chinese edition, 360note.com = English edition.
# Both domains serve the same Vite build and proxy to the same API.
#
# On this server the certificates are managed by BT Panel:
#   /www/server/panel/vhost/cert/360note.com/{fullchain,privkey}.pem
#   /www/server/panel/vhost/cert/360biji.com/{fullchain,privkey}.pem
# Replace the certificate paths below if you use another ACME client.

server {
    listen 80;
    server_name 360note.com www.360note.com;
    root /www/wwwroot/360note.com;

    location /.well-known/acme-challenge/ { root /www/wwwroot/360note.com; allow all; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name 360note.com www.360note.com;

    ssl_certificate     /www/server/panel/vhost/cert/360note.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/360note.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /opt/360note/apps/web/dist;
    index index.html;
    server_tokens off;
    client_max_body_size 600m;

    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://cloudflareinsights.com https://static.cloudflareinsights.com; media-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;

    location /.well-known/acme-challenge/ { root /www/wwwroot/360note.com; allow all; }

    location /api/ {
        set $real_client_ip $remote_addr;
        if ($http_cf_connecting_ip) { set $real_client_ip $http_cf_connecting_ip; }
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $real_client_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8787/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location = /sitemap.xml {
        default_type application/xml;
        try_files /sitemap-en.xml =404;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location ^~ /s/ {
        add_header X-Robots-Tag "noindex" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://cloudflareinsights.com https://static.cloudflareinsights.com; media-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;
        try_files $uri /s/index.html;
    }

    location = /s/index.html {
        internal;
        alias /opt/360note/apps/web/dist/index.html;
        add_header X-Robots-Tag "noindex" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        root /var/www/360note-errors;
        internal;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}

