<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>360note — 服务暂时不可用</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f3ec;
    --text: #181a1f;
    --muted: #67655f;
    --faint: #918d84;
    --line: #e2ddd3;
    --accent: #17865b;
    --accent-contrast: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--text);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .page { width: min(480px, calc(100vw - 48px)); padding: 40px 0; }
  .brand { display: flex; align-items: center; gap: 9px; font-size: 19px; font-weight: 700; letter-spacing: -0.04em; margin-bottom: 48px; }
  .brand img { width: 26px; height: 26px; border-radius: var(--radius-xs-sm, 7px); display: block; }
  .brand i { color: var(--accent); font-style: normal; }
  .code { font-size: 13px; font-weight: 600; letter-spacing: .12em; color: var(--faint); text-transform: uppercase; margin-bottom: 14px; }
  h1 { font-size: 28px; line-height: 1.25; letter-spacing: -0.03em; font-weight: 650; margin: 0 0 12px; }
  p { font-size: 15px; line-height: 1.7; color: var(--muted); margin: 0 0 28px; max-width: 400px; }
  .actions { display: flex; align-items: center; gap: 10px; }
  a.retry { display: inline-flex; align-items: center; height: 36px; padding: 0 16px; background: var(--accent); color: var(--accent-contrast); border-radius: 8px; font-size: 14px; font-weight: 600; text-decoration: none; }
  a.secondary { font-size: 13px; color: var(--muted); text-decoration: none; }
  a.secondary:hover { color: var(--text); text-decoration: none; }
  .foot { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--faint); }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #0f1511;
      --text: #ece9e2;
      --muted: #a09e99;
      --faint: #7d7b78;
      --line: #223028;
      --accent: #5fd3a0;
      --accent-contrast: #10131e;
    }
  }
</style>
</head>
<body>
  <main class="page">
    <div class="brand"><img src="/favicon.svg" alt="" width="26" height="26"><span>360note<i>.</i></span></div>
    <div class="code">503 · Service unavailable</div>
    <h1>服务暂时不可用</h1>
    <p>应用正在重启或数据库暂时不可达。你的笔记数据不会因此丢失。请稍等片刻后重试；如果持续出现，请联系实例管理员。</p>
    <div class="actions">
      <a class="retry" href="/">重新加载</a>
      <a class="secondary" href="/health">查看状态</a>
    </div>
    <div class="foot">360note 只发送账户与安全相关邮件。管理员可通过服务器日志排查此问题。</div>
  </main>
</body>
</html>
